# Noctalia v5.4.1 config - cleaned up from the old v4-style flat keys.
# Validate with: noctalia config validate ./config.toml

# ---------------------------------------------------------------- shell
[shell]
avatar_path = "/home/loon/Pictures/Avatars/ein2.png"
font_family = "JetBrainsMono Nerd Font"
lang = "en"
niri_overview_type_to_launch_enabled = true
polkit_agent = true
settings_show_advanced = true
telemetry_enabled = true          # default is false; this sends a startup ping

[shell.greeter_sync]
auto_sync = false

[shell.shadow]
direction = "down_right"          # was general.shadowDirection = "bottom_right"

[shell.panel]
transparency_mode = "soft"

[shell.launcher]
pinned = [
    "steam",
    "equibop",
    "net.lutris.battlenet-3",
    "fr.handbrake.ghb",
    "spotify",
    "zen-beta",
    "com.obsproject.Studio",
]

[shell.mpris]
blacklist = []                    # was audio.mprisBlacklist

# Session panel (was sessionMenu.powerOptions)
[shell.session]
grid = false                      # was largeButtonsLayout = "single-row"

[[shell.session.actions]]
action = "lock"
shortcut = "1"

[[shell.session.actions]]
action = "suspend"
shortcut = "2"

[[shell.session.actions]]
action = "command"
command = "systemctl hibernate"
label = "Hibernate"
glyph = "moon"
shortcut = "3"

[[shell.session.actions]]
action = "reboot"
shortcut = "4"
countdown_seconds = 10

[[shell.session.actions]]
action = "logout"
shortcut = "5"
countdown_seconds = 10

[[shell.session.actions]]
action = "shutdown"
shortcut = "6"
countdown_seconds = 10
variant = "destructive"

[[shell.session.actions]]
action = "reboot_uefi"
shortcut = "7"
countdown_seconds = 10

[lockscreen]
lock_before_suspend = true        # was general.lockOnSuspend
blur_intensity = 0.0              # was general.lockScreenBlur = 0
tint_intensity = 0.0              # was general.lockScreenTint = 0

# ---------------------------------------------------------------- theme
[theme]
mode = "dark"                     # was colorSchemes.darkMode
source = "wallpaper"              # was colorSchemes.useWallpaperColors
builtin = "Noctalia"              # was "m3-tonal-spot", which isn't a palette name
wallpaper_scheme = "m3-tonal-spot"
sync_color_scheme = true          # was colorSchemes.syncGsettings

[theme.templates]
builtin_ids = [ "btop", "gtk3", "gtk4", "helix", "kitty", "niri", "qt", "starship" ]
community_ids = [ "spicetify", "zen-browser", "discord", "neovim", "prismlauncher", "steam", "fuzzel", "yazi" ]

# ---------------------------------------------------------------- bar
# Bars are named tables now: [bar.<name>]. The old flat [bar] keys are gone.
[bar.default]
position = "left"
thickness = 28
scale = 0.9
margin_edge = 2
background_opacity = 0.75
start = [ "nix_monitor_2", "spacer_8", "workspaces", "taskbar", "spacer_2", "cat", "spacer_3", "cpu", "temp", "ram" ]
center = [ "audio_visualizer", "spacer_9", "active_window", "spacer_10", "audio_visualizer" ]
end = [
    "weather",
    "spacer_5",
    "tray",
    "notifications",
    "wallpaper",
    "clipboard",
    "spacer_7",
    "bar",
    "recorder",
    "bluetooth",
    "network",
    "spacer_6",
    "widget",
    "volume",
    "spacer_11",
    "clock",
    "spacer_4",
    "control-center",
]

# ---------------------------------------------------------------- widgets
[widget.clock]
format = "{:%I:%M%p}"

[widget.control-center]
color = "primary"
custom_image = "/home/loon/styx/assets/nix-snowflake-white.svg"

[widget.network]
show_label = false

[widget.tray]
drawer = true

[widget.volume]
show_label = true

[widget.workspaces]
pill_scale = 0.5
show_labels = false

# System monitor widgets ("cpu", "temp", "ram" aren't built-in types)
[widget.cpu]
type = "sysmon"
stat = "cpu_usage"

[widget.temp]
type = "sysmon"
stat = "cpu_temp"

[widget.ram]
type = "sysmon"
stat = "ram_used"

# Plugin widgets
[widget.bar]
type = "raycursive/niri-displays:bar"
show_resolution = false

[widget.cat]
type = "dotnetrob/cat:cat"

[widget.nix_monitor_2]
type = "avivbintangaringga/nix-monitor:nix-monitor"
colorize_glyph = false
show_text = false

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.widget]
type = "blackbartblues/audio-switcher:widget"

# Spacers
[widget.spacer_2]
type = "spacer"
length = 400

[widget.spacer_3]
type = "spacer"

[widget.spacer_4]
type = "spacer"

[widget.spacer_5]
type = "spacer"

[widget.spacer_6]
type = "spacer"

[widget.spacer_7]
type = "spacer"

[widget.spacer_8]
type = "spacer"
length = 30

[widget.spacer_9]
type = "spacer"

[widget.spacer_10]
type = "spacer"

[widget.spacer_11]
type = "spacer"

# ---------------------------------------------------------------- dock
[dock]
enabled = false
position = "bottom"
icon_size = 32
auto_hide = true
reserve_space = false
background_opacity = 1.0
active_monitor_only = true        # was dock.onlySameOutput
show_dots = false                 # was dock.showDockIndicator
launcher_position = "none"        # was showLauncherIcon = false
pinned = [ "kitty", "zen", "steam", "equibop", "spotify", "FFPWA-01KSRNJ4GQZHM7KDXXQXB18M7C", "fr.handbrake.ghb" ]

# ---------------------------------------------------------------- services
[audio]
enable_sounds = true
enable_overdrive = false          # was audio.volumeOverdrive
enable_volume_sounds = false      # was audio.volumeFeedback

[calendar]
enabled = true

[calendar.account.wtosman]
name = "Troy's Calendar"
type = "google"

[location]
auto_locate = false
address = "Apple Valley, MN"      # moved here from [weather] / old [location]

[weather]
enabled = true
unit = "imperial"                 # was location.useFahrenheit = true
effects = true                    # was location.weatherShowEffects

[nightlight]
enabled = false
force = false
temperature_day = 6500
temperature_night = 4000

# Idle behaviours (was flat idle.* keys). All disabled, as before.
[idle]
behavior_order = [ "lock", "screen-off", "suspend" ]

[idle.behavior.lock]
action = "lock"
timeout = 660
enabled = false

[idle.behavior.screen-off]
action = "screen_off"
timeout = 600
enabled = false

[idle.behavior.suspend]
action = "lock_and_suspend"
timeout = 1800
enabled = false

# ---------------------------------------------------------------- notifications / OSD
# [notifications] (plural) became [notification] (singular)
[notification]
scale = 0.75
background_opacity = 1.0
layer = "overlay"                 # was notifications.overlayLayer = true

[osd]
enabled = true
position = "top_right"
hide_delay_ms = 2000
background_opacity = 1.0

# Old enabledTypes = [0, 1, 2] meant volume, mic volume and brightness only.
# Flip any of these to true to get the other popups back.
[osd.kinds]
volume = true
volume_output = true
volume_input = true
brightness = true
wifi = false
bluetooth = false
power_profile = false
caffeine = false
nightlight = false
dnd = false
lock_keys = false
keyboard_layout = false
media = false
media_volume = false
privacy = false
keyboard_backlight = false
custom = false

# ---------------------------------------------------------------- plugins
[plugins]
auto_update = "none"              # was autoUpdate = false (booleans are rejected now)
enabled = [
    "noctalia/screen_recorder",
    "avivbintangaringga/nix-monitor",
    "imjustdoingmypart/niri-animations",
    "dotnetrob/cat",
    "blackbartblues/audio-switcher",
    "raycursive/niri-displays",
    "ayagmar/obs-control",
]

[plugin_settings."avivbintangaringga/nix-monitor"]
update_command = "cd ~/styx; nix flake update"

[plugin_settings."blackbartblues/audio-switcher"]
show_percentage = false

[plugin_settings."noctalia/screen_recorder"]
audio_source = "both"
color_range = "full"
replay_duration = 60
replay_enabled = true
replay_storage = "disk"
video_source = "focused"

# ---------------------------------------------------------------- wallpaper
[wallpaper]
directory = "/home/loon/Pictures/Wallpapers"
transition_on_startup = true

[wallpaper.automation]
interval_seconds = 900            # was interval_minutes = 15

[wallpaper.default]
path = "/home/loon/Pictures/Wallpapers/zelda-princess-of-dreams-by-estellier.png"

[wallpaper.last]
path = "/home/loon/Pictures/Wallpapers/zelda-princess-of-dreams-by-estellier.png"

[wallpaper.monitors.DP-4]
path = "/home/loon/Pictures/Wallpapers/zelda-princess-of-dreams-by-estellier.png"

[wallpaper.monitors.DP-5]
path = "/home/loon/Pictures/Wallpapers/frieren-beyond-journeys-end-flower-field.png"

[[wallpaper.favorite]]
palette_source = "wallpaper"
path = "/home/loon/Pictures/Wallpapers/frieren-beyond-journeys-end-flower-field.png"
theme_mode = "dark"
wallpaper_scheme = "m3-tonal-spot"

[[wallpaper.favorite]]
palette_source = "wallpaper"
path = "/home/loon/Pictures/Wallpapers/rick-and-morty.png"
