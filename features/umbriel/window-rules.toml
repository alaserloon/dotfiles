# Blur every window
[[window_rule]]
blur = true

# Place a game on workspace 4
[[window_rule]]
match.app_id = "^steam_app_[0-9]+$"
default_workspace = 4
default_fullscreen = true

# Enable VRR for game content
[[window_rule]]
match.content_type = "game"
vrr = "always"

[[window_rule]]
default_position = { x = 12, y=12, anchor = "bottom_right" }
# match.title = "^notificationtoasts_\\d+_desktop$"
match.title = "^notificationtoasts_.+_desktop"
default_focused = false

[[window_rule]]
match.title = "Friends List"
focus_on_activate = false
default_scrolling_extent = 0.10
# default_floating = true
# default_floating_size_px = { width = 329, height = 1379 }
# default_position = { x = 10, y = 0, anchor = "right" }

# Dim unfocused windows
[[window_rule]]
match.is_focused = false
opacity = 0.85

[[window_rule]]
match.is_focused = true
opacity = 1.0
